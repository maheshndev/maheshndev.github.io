name: Deploy to GitHub Pages

on:
  push:
    branches: ["portfolio"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Inject API Keys into JS
        run: |
          sed -i "s|__SUPABASE_URL__|${{ secrets.SUPABASE_URL }}|g" js/contact.js
          sed -i "s|__SUPABASE_ANON_KEY__|${{ secrets.SUPABASE_ANON_KEY }}|g" js/contact.js
          sed -i "s|__CONTACT_EMAIL__|${{ secrets.CONTACT_EMAIL }}|g" js/contact.js
# Inject Email into HTML files
find . -name "*.html" -type f -exec sed -i "s|__CONTACT_EMAIL__|${{ secrets.CONTACT_EMAIL }}|g" {} +
# Inject Email into contact data for the contact component
find . -path "./data/contact.json" -exec sed -i "s|__CONTACT_EMAIL__|${{ secrets.CONTACT_EMAIL }}|g" {} +
          # Inject Email into roadmap / infographic data (CTA mailto links)
          find . -path "./data/career-roadmap.json" -exec sed -i "s|__CONTACT_EMAIL__|${{ secrets.CONTACT_EMAIL }}|g" {} +
          find . -path "./data/infographic.json" -exec sed -i "s|__CONTACT_EMAIL__|${{ secrets.CONTACT_EMAIL }}|g" {} +

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
