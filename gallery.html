<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gallery — Mahesh Narsale</title>
  <meta name="description" content="Visual Showcase and Screenshots of Projects by Mahesh Narsale." />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>

  <link href="https://unpkg.com/flowbite@1.6.5/dist/flowbite.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>

<body class="antialiased bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

  <!-- NAVBAR (injected) -->
  <div id="site-header"></div>

  <main class="flex-grow pt-16 pb-24">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
      <!-- Header -->
      <div class="text-center max-w-3xl mx-auto mb-16">
        <h1 class="text-4xl sm:text-5xl font-extrabold mb-6">Project <span class="text-gradient">Gallery</span></h1>
        <p class="text-lg text-slate-600 dark:text-slate-400">
          Visual glimpses into the interfaces, dashboards, and systems I've built. 
          A picture is worth a thousand lines of code.
        </p>
      </div>

      <!-- Gallery Grid -->
      <div data-gallery-group
        data-src="data/gallery.json"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/components/icons.js"></script>
  <script src="js/components/mount.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/includes.js"></script>
  <script defer src="js/components/gallery.js"></script>
  <script type="text/template" data-deps="defer-after-includes" src="js/contact.js"></script>
  <script src="https://unpkg.com/flowbite@1.6.5/dist/flowbite.min.js"></script>
</body>
</html>
