<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gallery — Mahesh Narsale</title>
  <link rel="icon" type="image/png" href="assets/portfolio-icon.png" />
  <meta name="description" content="Visual Showcase and Screenshots of Projects by Mahesh Narsale." />

  <!-- Apply saved/system theme before first paint (prevents light/dark flash) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="stylesheet" href="css/3d.css">
</head>

<body class="antialiased bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

  <!-- NAVBAR (injected) -->
  <div id="site-header"></div>

  <main class="flex-grow pt-16 pb-24">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 [perspective:1200px]">
      <!-- Header -->
      <div class="text-center max-w-3xl mx-auto mb-16 [transform-style:preserve-3d] [transform:translateZ(20px)]">
        <h1 class="text-4xl sm:text-5xl font-extrabold mb-6">Project <span class="text-gradient [filter:drop-shadow(0_6px_18px_rgba(139,92,246,0.35))]">Gallery</span></h1>
        <p class="text-lg text-slate-600 dark:text-slate-400">
          Visual glimpses into the interfaces, dashboards, and systems I've built. 
          A picture is worth a thousand lines of code.
        </p>
      </div>

      <!-- Gallery Grid -->
      <div data-gallery-group
        data-src="data/gallery.json"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/components/icons.js"></script>
  <script src="js/components/mount.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/includes.js"></script>
  <script defer src="js/components/gallery.js"></script>
  <script type="text/template" data-deps="defer-after-includes" src="js/contact.js"></script>
  <script src="js/3d.js" defer></script>
</body>
</html>
